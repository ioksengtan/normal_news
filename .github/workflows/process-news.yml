name: 處理新聞（去偏見管線）

on:
  schedule:
    - cron: '*/30 * * * *' # 每 30 分鐘觸發一次；GitHub Actions 的排程不保證準點
  workflow_dispatch: {} # 允許在 Actions 頁面手動觸發，方便測試

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: 執行去偏見管線
        run: npm run process
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 把處理結果 commit 回 repo
        run: |
          git config user.name "normal-news-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: 更新新聞處理資料"
          git push
