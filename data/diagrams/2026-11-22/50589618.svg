<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 420">
  <rect width="360" height="420" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro 420ei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 16px; }
    .sub { fill: #5e584e; font-size: 13px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" marker420eight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <text x="180" y="30" text-anchor="middle">1,700 萬行的證明，三道檢查</text>
  <rect x="60" y="46" width="240" height="56" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="71" text-anchor="middle">Alpöge 的 Lean 程式庫</text>
  <text x="180" y="91" text-anchor="middle" class="sub">只依賴 Mathlib</text>
  <line x1="180" y1="102" x2="180" y2="122" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="60" y="128" width="240" height="56" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="153" text-anchor="middle">① 能編譯嗎？</text>
  <text x="180" y="173" text-anchor="middle" class="sub">數十人得到相同輸出檔</text>
  <line x1="180" y1="184" x2="180" y2="204" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="60" y="210" width="240" height="56" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="235" text-anchor="middle">② 證的是同一句話嗎？</text>
  <text x="180" y="255" text-anchor="middle" class="sub">兩套工具比對敘述</text>
  <line x1="180" y1="266" x2="180" y2="286" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="60" y="292" width="240" height="56" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="317" text-anchor="middle">③ 每一步都對嗎？</text>
  <text x="180" y="337" text-anchor="middle" class="sub">官方核心與多個檢查程式</text>
  <text x="180" y="390" text-anchor="middle" class="sub">像不會漏看任何一步的閱卷老師</text>
</svg>
