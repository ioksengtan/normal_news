<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300">
  <rect width="360" height="300" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 14px; }
    .sub { fill: #5e584e; font-size: 12px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <rect x="20" y="30" width="130" height="60" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="85" y="56" text-anchor="middle">Uptime Kuma</text>
  <text x="85" y="76" text-anchor="middle" class="sub">定時敲門的管理員</text>
  <rect x="210" y="30" width="130" height="60" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="275" y="56" text-anchor="middle">網站或伺服器</text>
  <text x="275" y="76" text-anchor="middle" class="sub">HTTP、Ping、DNS…</text>
  <line x1="150" y1="50" x2="206" y2="50" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <text x="178" y="42" text-anchor="middle" class="sub">還在嗎？</text>
  <line x1="210" y1="72" x2="154" y2="72" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <text x="182" y="104" text-anchor="middle" class="sub">最短每 20 秒一次</text>
  <line x1="85" y1="90" x2="85" y2="150" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <text x="95" y="128" class="sub">沒有回應時</text>
  <rect x="20" y="154" width="320" height="56" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="178" text-anchor="middle">發出提醒</text>
  <text x="180" y="198" text-anchor="middle" class="sub">Telegram、Discord、Slack、電子郵件等 90 多種</text>
  <rect x="20" y="230" width="320" height="50" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="252" text-anchor="middle">公開的狀態頁面</text>
  <text x="180" y="270" text-anchor="middle" class="sub">可以做好幾個</text>
</svg>
