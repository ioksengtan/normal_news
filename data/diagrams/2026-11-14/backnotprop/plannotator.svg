<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300">
  <rect width="360" height="300" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 14px; }
    .sub { fill: #5e584e; font-size: 12px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <rect x="20" y="30" width="130" height="70" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="85" y="58" text-anchor="middle">寫程式助手</text>
  <text x="85" y="80" text-anchor="middle" class="sub">提出計畫或改完程式</text>
  <rect x="210" y="30" width="130" height="70" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="275" y="58" text-anchor="middle">Plannotator</text>
  <text x="275" y="80" text-anchor="middle" class="sub">在瀏覽器自動打開</text>
  <line x1="150" y1="65" x2="206" y2="65" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <line x1="275" y1="100" x2="275" y2="150" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="180" y="154" width="160" height="70" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="260" y="182" text-anchor="middle">使用者批改</text>
  <text x="260" y="204" text-anchor="middle" class="sub">像紅筆畫線、留言</text>
  <path d="M180,189 L85,189 L85,104" fill="none" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <text x="130" y="180" text-anchor="middle" class="sub">一鍵送回</text>
  <text x="180" y="262" text-anchor="middle" class="sub">計畫、留言與設定預設存在自己的電腦</text>
</svg>
