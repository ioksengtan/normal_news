<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380">
  <rect width="360" height="380" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 16px; }
    .sub { fill: #5e584e; font-size: 13px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <text x="180" y="30" text-anchor="middle">Versine：用對話付款</text>
  <rect x="50" y="48" width="260" height="50" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="79" text-anchor="middle">對助手說要付多少給誰</text>
  <line x1="180" y1="98" x2="180" y2="122" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="50" y="126" width="260" height="58" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="152" text-anchor="middle">助手透過 MCP 接上錢包</text>
  <text x="180" y="174" text-anchor="middle" class="sub">MCP 像助手與服務之間的轉接頭</text>
  <line x1="180" y1="184" x2="180" y2="208" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="50" y="212" width="260" height="58" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="238" text-anchor="middle">在 App 用通行密鑰同意</text>
  <text x="180" y="260" text-anchor="middle" class="sub">信任的聯絡人可設成免同意</text>
  <line x1="180" y1="270" x2="180" y2="294" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="50" y="298" width="260" height="58" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="324" text-anchor="middle">從錢包餘額匯出</text>
  <text x="180" y="346" text-anchor="middle" class="sub">一次最多 100 人；沒帳號者可提領到銀行</text>
</svg>
