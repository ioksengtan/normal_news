<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280">
  <rect width="360" height="280" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 13px; }
    .sub { fill: #5e584e; font-size: 11px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <rect x="20" y="30" width="140" height="60" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="90" y="57" text-anchor="middle">1 安裝擴充功能</text>
  <text x="90" y="76" text-anchor="middle" class="sub">版本 2.1.313</text>
  <line x1="160" y1="60" x2="198" y2="60" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="200" y="30" width="140" height="60" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="270" y="57" text-anchor="middle">2 注入程式執行</text>
  <text x="270" y="76" text-anchor="middle" class="sub">載入檔案就跑</text>
  <line x1="270" y1="90" x2="270" y2="118" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="200" y="120" width="140" height="60" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="270" y="147" text-anchor="middle">3 加入 SSH 金鑰</text>
  <text x="270" y="166" text-anchor="middle" class="sub">寫入授權檔</text>
  <line x1="200" y1="150" x2="162" y2="150" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="20" y="120" width="140" height="60" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="90" y="147" text-anchor="middle">4 通報並下架</text>
  <text x="90" y="166" text-anchor="middle" class="sub">Cursor 移除版本</text>
  <rect x="20" y="215" width="320" height="45" fill="#fbf8f1" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="243" text-anchor="middle">載入即執行，金鑰寫入，之後下架</text>
</svg>
