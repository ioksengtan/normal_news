<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330">
  <rect width="360" height="330" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 16px; }
    .sub { fill: #5e584e; font-size: 13px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <text x="180" y="28" text-anchor="middle">Crissy Field 研究的篩選過程</text>
  <rect x="20" y="46" width="320" height="64" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="74" text-anchor="middle">159,041 個 Lovable 專案</text>
  <text x="180" y="96" text-anchor="middle" class="sub">來自 Common Crawl</text>
  <line x1="180" y1="110" x2="180" y2="128" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="60" y="132" width="240" height="64" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="160" text-anchor="middle">24,664 個網站</text>
  <text x="180" y="182" text-anchor="middle" class="sub">一載入就送出資料庫內容</text>
  <line x1="180" y1="196" x2="180" y2="214" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="95" y="218" width="170" height="64" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="246" text-anchor="middle">7,403 個網站</text>
  <text x="180" y="268" text-anchor="middle" class="sub">有含電子郵件的資料表</text>
  <text x="180" y="314" text-anchor="middle" class="sub">只用唯讀查詢，不登入</text>
</svg>
