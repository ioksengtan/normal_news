<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300">
  <rect width="360" height="300" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 14px; }
    .sub { fill: #5e584e; font-size: 12px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <rect x="40" y="24" width="280" height="52" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="56" text-anchor="middle">客服訊息／網域等輸入</text>
  <line x1="180" y1="76" x2="180" y2="98" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="50" y="100" width="120" height="70" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="110" y="130" text-anchor="middle">Clef</text>
  <text x="110" y="152" text-anchor="middle" class="sub">中位延遲 209 毫秒</text>
  <rect x="190" y="100" width="120" height="70" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="250" y="130" text-anchor="middle">Clef-flash</text>
  <text x="250" y="152" text-anchor="middle" class="sub">中位延遲 38.8 毫秒</text>
  <line x1="180" y1="170" x2="180" y2="192" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="40" y="196" width="280" height="72" fill="#fbf8f1" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="226" text-anchor="middle">輸出帶機率的結構化選項</text>
  <text x="180" y="250" text-anchor="middle" class="sub">像在多個按鈕裡挑一個，並標出把握</text>
</svg>
