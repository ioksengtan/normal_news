<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280">
  <rect width="360" height="280" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 14px; }
    .sub { fill: #5e584e; font-size: 12px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <rect x="40" y="20" width="280" height="48" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="50" text-anchor="middle">螢幕上方缺口／頂列</text>
  <circle cx="180" cy="110" r="28" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <circle cx="170" cy="106" r="4" fill="#1c1915"/>
  <circle cx="190" cy="106" r="4" fill="#1c1915"/>
  <text x="180" y="155" text-anchor="middle">小角色 Coucou</text>
  <line x1="180" y1="160" x2="180" y2="178" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="30" y="182" width="140" height="70" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="100" y="212" text-anchor="middle">監看代理程式</text>
  <text x="100" y="234" text-anchor="middle" class="sub">讀檔、改檔、執行</text>
  <rect x="190" y="182" width="140" height="70" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="260" y="212" text-anchor="middle">一鍵允許／拒絕</text>
  <text x="260" y="234" text-anchor="middle" class="sub">不必切換視窗</text>
</svg>
