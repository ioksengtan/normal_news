<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280">
  <rect width="360" height="280" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 13px; }
    .sub { fill: #5e584e; font-size: 11px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="320" height="45" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180.0" y="47.0" text-anchor="middle">按下快捷鍵並說話</text>
  <line x1="180" y1="65" x2="180" y2="93" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="20" y="95" width="320" height="55" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180.0" y="119.5" text-anchor="middle">在自己的電腦上辨識</text>
  <text x="180.0" y="137.5" text-anchor="middle" class="sub">Whisper 或 Parakeet V3，不上傳雲端</text>
  <line x1="180" y1="150" x2="180" y2="183" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="20" y="185" width="320" height="45" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180.0" y="212.0" text-anchor="middle">文字貼進正在使用的程式</text>
</svg>
