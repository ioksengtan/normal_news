    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 13px; }
    .sub { fill: #5e584e; font-size: 11px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="320" height="50" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180.0" y="49.5" text-anchor="middle">K 線資料（開高低收與成交量）</text>
  <line x1="180" y1="70" x2="180" y2="103" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="20" y="105" width="320" height="50" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180.0" y="127.0" text-anchor="middle">分詞器</text>
  <text x="180.0" y="145.0" text-anchor="middle" class="sub">切成一個個離散的代碼</text>
  <line x1="180" y1="155" x2="180" y2="188" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="20" y="190" width="320" height="60" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180.0" y="217.0" text-anchor="middle">Transformer 模型</text>
