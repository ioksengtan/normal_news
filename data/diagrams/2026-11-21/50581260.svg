<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400">
  <rect width="360" height="400" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 16px; }
    .sub { fill: #5e584e; font-size: 13px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <text x="180" y="28" text-anchor="middle">24 層分成四組</text>
  <rect x="90" y="44" width="180" height="44" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="72" text-anchor="middle">第 1 組：6 層 ×1</text>
  <line x1="180" y1="88" x2="180" y2="108" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="90" y="114" width="180" height="44" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="142" text-anchor="middle">第 2 組：6 層 ×3</text>
  <line x1="180" y1="158" x2="180" y2="178" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="90" y="184" width="180" height="44" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="212" text-anchor="middle">第 3 組：6 層 ×3</text>
  <line x1="180" y1="228" x2="180" y2="248" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="90" y="254" width="180" height="44" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="282" text-anchor="middle">第 4 組：6 層 ×1</text>
  <path d="M270,136 C320,136 320,206 270,206" fill="none" stroke="#1c1915" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#箭頭)"/>
  <path d="M90,206 C40,206 40,136 90,136" fill="none" stroke="#1c1915" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#箭頭)"/>
  <text x="330" y="176" text-anchor="middle" class="sub">重</text><text x="330" y="192" text-anchor="middle" class="sub">跑</text>
  <text x="180" y="334" text-anchor="middle" class="sub">中間兩組每個字詞跑三次</text>
  <text x="180" y="360" text-anchor="middle" class="sub">像把題目在腦中多想幾遍</text>
</svg>
