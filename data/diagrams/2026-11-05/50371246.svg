<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280">
  <rect width="360" height="280" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 13px; }
    .sub { fill: #5e584e; font-size: 11px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="320" height="55" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="45" text-anchor="middle">付費使用住宅代理服務</text>
  <text x="180" y="63" text-anchor="middle" class="sub">送出的流量經由別人的裝置</text>
  <line x1="180" y1="75" x2="180" y2="103" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="20" y="105" width="320" height="55" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="130" text-anchor="middle">代理軟體裝在某台裝置上</text>
  <text x="180" y="148" text-anchor="middle" class="sub">流量從該裝置的網路出去</text>
  <line x1="180" y1="160" x2="180" y2="188" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="20" y="190" width="320" height="55" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="215" text-anchor="middle">白宮網路出現 6 個出口位址</text>
  <text x="180" y="233" text-anchor="middle" class="sub">Layer3 Intel 在 30 天內觀察 236 次</text>
</svg>
