<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300">
  <rect width="360" height="300" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 14px; }
    .sub { fill: #5e584e; font-size: 12px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <rect x="24" y="28" width="100" height="70" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="74" y="56" text-anchor="middle">專案程式</text>
  <text x="74" y="78" text-anchor="middle" class="sub">本機檔案</text>
  <line x1="124" y1="63" x2="152" y2="63" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="156" y="28" width="110" height="70" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="211" y="56" text-anchor="middle">CodeGraph</text>
  <text x="211" y="78" text-anchor="middle" class="sub">預先建關係圖</text>
  <line x1="266" y1="63" x2="294" y2="63" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="296" y="28" width="44" height="70" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="318" y="56" text-anchor="middle">代理</text>
  <text x="318" y="78" text-anchor="middle" class="sub">程式</text>
  <rect x="30" y="120" width="300" height="56" fill="#fbf8f1" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="144" text-anchor="middle">像先畫好地圖，再問「哪裡相關」</text>
  <text x="180" y="164" text-anchor="middle" class="sub">改檔時自動同步，資料留在本機</text>
  <rect x="30" y="196" width="300" height="72" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="226" text-anchor="middle">接上 Claude Code、Cursor 等</text>
  <text x="180" y="248" text-anchor="middle" class="sub">核心用 Rust；安裝可不必另裝 Node</text>
</svg>
