<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280">
  <rect width="360" height="280" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 13px; }
    .sub { fill: #5e584e; font-size: 11px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <rect x="20" y="50" width="95" height="70" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="67.5" y="82.0" text-anchor="middle">技能資料夾</text>
  <text x="67.5" y="101.0" text-anchor="middle" class="sub">一項技能</text>
  <line x1="115" y1="85" x2="142" y2="85" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="145" y="50" width="95" height="70" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="192.5" y="82.0" text-anchor="middle">規則資料夾</text>
  <text x="192.5" y="101.0" text-anchor="middle" class="sub">工具讀得到</text>
  <line x1="240" y1="85" x2="267" y2="85" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="270" y="50" width="70" height="70" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="305.0" y="82.0" text-anchor="middle">登陸頁</text>
  <text x="305.0" y="101.0" text-anchor="middle" class="sub">照規則做</text>
  <rect x="20" y="215" width="320" height="45" fill="#fbf8f1" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="243" text-anchor="middle">像把工作手冊交給工具照著做</text>
