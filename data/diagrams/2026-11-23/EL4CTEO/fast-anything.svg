<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470">
  <rect width="360" height="470" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 16px; }
    .sub { fill: #5e584e; font-size: 13px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <text x="180" y="30" text-anchor="middle">fast-anything 的做法</text>
  <rect x="50" y="48" width="260" height="50" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="72" text-anchor="middle">1. 效能分析</text>
  <text x="180" y="90" text-anchor="middle" class="sub">量出哪幾段最塞車</text>
  <line x1="180" y1="98" x2="180" y2="122" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="50" y="126" width="260" height="50" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="150" text-anchor="middle">2. 助手只改寫慢的函式</text>
  <text x="180" y="168" text-anchor="middle" class="sub">改成 Rust 語言</text>
  <line x1="180" y1="176" x2="180" y2="200" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="50" y="204" width="260" height="50" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="228" text-anchor="middle">3. 重播真實呼叫比對</text>
  <text x="180" y="246" text-anchor="middle" class="sub">最多 500 次，加上邊界情況</text>
  <line x1="180" y1="254" x2="180" y2="278" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="50" y="282" width="260" height="50" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="306" text-anchor="middle">4. 全部相同才換上</text>
  <text x="180" y="324" text-anchor="middle" class="sub">可以隨時換回原本的程式</text>
  <text x="40" y="372">Python 去重複名字</text>
  <rect x="40" y="384" width="240" height="22" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
  <text x="288" y="401">4.91 秒</text>
  <rect x="40" y="414" width="4" height="22" fill="#1c1915"/>
  <text x="52" y="431">42 毫秒</text>
  <text x="40" y="458" class="sub">作者在 i5-10500、Windows 11 上的測試</text>
</svg>
