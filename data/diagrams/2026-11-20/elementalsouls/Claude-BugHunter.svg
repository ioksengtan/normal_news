  <line x1="180" y1="98" x2="180" y2="128" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="80" y="134" width="200" height="48" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="164" text-anchor="middle">Claude Code</text>
  <line x1="180" y1="182" x2="180" y2="210" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <text x="196" y="202" class="sub">自動翻開相關手冊</text>
  <rect x="40" y="216" width="40" height="60" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
