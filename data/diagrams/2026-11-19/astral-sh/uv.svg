<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330">
  <rect width="360" height="330" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 16px; }
    .sub { fill: #5e584e; font-size: 13px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <text x="180" y="28" text-anchor="middle">一個工具，取代多個工具</text>
  <rect x="20" y="48" width="100" height="40" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="70" y="74" text-anchor="middle">pip</text>
  <rect x="130" y="48" width="100" height="40" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="74" text-anchor="middle">pipx</text>
  <rect x="240" y="48" width="100" height="40" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="290" y="74" text-anchor="middle">poetry</text>
  <rect x="20" y="98" width="100" height="40" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="70" y="124" text-anchor="middle">pyenv</text>
  <rect x="130" y="98" width="100" height="40" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="124" text-anchor="middle">twine</text>
  <rect x="240" y="98" width="100" height="40" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="290" y="124" text-anchor="middle">virtualenv</text>
  <text x="180" y="160" text-anchor="middle" class="sub">還有 pip-tools 等</text>
  <line x1="70" y1="168" x2="160" y2="208" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <line x1="180" y1="168" x2="180" y2="206" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <line x1="290" y1="168" x2="200" y2="208" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="100" y="214" width="160" height="56" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="248" text-anchor="middle" style="font-size:22px">uv</text>
  <text x="180" y="296" text-anchor="middle" class="sub">下載套件、記下版本、準備獨立環境、</text>
  <text x="180" y="316" text-anchor="middle" class="sub">安裝與切換 Python 版本</text>
</svg>
