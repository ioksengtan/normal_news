  <rect x="20" y="205" width="320" height="50" fill="#fbf8f1" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180.0" y="234.0" text-anchor="middle">模仿真實遊戲工作室的分工</text>
  <line x1="95" y1="170" x2="95" y2="203" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <line x1="265" y1="170" x2="265" y2="203" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
</svg>
