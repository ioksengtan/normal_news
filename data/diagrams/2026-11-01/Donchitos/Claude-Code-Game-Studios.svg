<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280">
  <rect width="360" height="280" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 13px; }
    .sub { fill: #5e584e; font-size: 11px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <rect x="100" y="20" width="160" height="55" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180.0" y="51.5" text-anchor="middle">一個 Claude Code 工作階段</text>
  <line x1="180" y1="75" x2="180" y2="108" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="20" y="110" width="150" height="60" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="95.0" y="138.0" text-anchor="middle">49 個代理</text>
  <text x="95.0" y="156.0" text-anchor="middle" class="sub">分工的角色</text>
  <rect x="190" y="110" width="150" height="60" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="265.0" y="138.0" text-anchor="middle">74 個技能</text>
