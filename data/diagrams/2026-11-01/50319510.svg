<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280">
  <rect width="360" height="280" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 13px; }
    .sub { fill: #5e584e; font-size: 11px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <rect x="20" y="15" width="320" height="50" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180.0" y="38.0" text-anchor="middle">39,834 則 HN 留言</text>
  <text x="180.0" y="56.0" text-anchor="middle" class="sub">2007 年起</text>
  <line x1="180" y1="65" x2="180" y2="88" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="20" y="90" width="320" height="50" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180.0" y="113.0" text-anchor="middle">約 4 萬則推薦 YouTube 影片</text>
  <text x="180.0" y="131.0" text-anchor="middle" class="sub">濾掉垃圾與低品質留言</text>
  <line x1="180" y1="140" x2="180" y2="163" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="20" y="165" width="320" height="50" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180.0" y="194.0" text-anchor="middle">6,454 部影片、150 個主題</text>
  <line x1="180" y1="215" x2="180" y2="238" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="20" y="240" width="320" height="36" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180.0" y="262.0" text-anchor="middle">HackerTube 網站</text>
</svg>
