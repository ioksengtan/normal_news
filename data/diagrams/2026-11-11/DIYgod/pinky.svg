<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300">
  <rect width="360" height="300" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 13px; }
    .sub { fill: #5e584e; font-size: 11px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <rect x="20" y="15" width="320" height="50" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="38" text-anchor="middle">AI 代理程式</text>
  <text x="180" y="55" text-anchor="middle" class="sub">透過 MCP 送出操作</text>
  <line x1="180" y1="65" x2="180" y2="93" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="20" y="95" width="320" height="50" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="118" text-anchor="middle">Pinky 閘道</text>
  <text x="180" y="135" text-anchor="middle" class="sub">代理程式無法自己批准</text>
  <line x1="110" y1="145" x2="90" y2="173" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <line x1="250" y1="145" x2="270" y2="173" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="15" y="175" width="150" height="55" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="90" y="198" text-anchor="middle">一般步驟</text>
  <text x="90" y="216" text-anchor="middle" class="sub">直接送到手機</text>
  <rect x="195" y="175" width="150" height="55" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="270" y="198" text-anchor="middle">付款、轉帳</text>
  <text x="270" y="216" text-anchor="middle" class="sub">先停住，等人按允許</text>
  <line x1="90" y1="230" x2="160" y2="253" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <line x1="270" y1="230" x2="200" y2="253" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="110" y="255" width="140" height="35" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="277" text-anchor="middle">手機</text>
</svg>
