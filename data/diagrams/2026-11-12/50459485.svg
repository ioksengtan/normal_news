<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300">
  <rect width="360" height="300" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 13px; }
    .sub { fill: #5e584e; font-size: 11px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <rect x="15" y="20" width="160" height="110" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="95" y="43" text-anchor="middle">工作流程</text>
  <text x="95" y="75" text-anchor="middle" class="sub">checkout@v7.0.1</text>
  <text x="95" y="100" text-anchor="middle" class="sub">只寫版本號</text>
  <rect x="185" y="20" width="160" height="110" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="265" y="43" text-anchor="middle">actions.lock</text>
  <text x="265" y="75" text-anchor="middle" class="sub">v7.0.1 → 提交 3d3c42e…</text>
  <text x="265" y="100" text-anchor="middle" class="sub">記下實際的提交</text>
  <line x1="95" y1="130" x2="160" y2="178" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <line x1="265" y1="130" x2="200" y2="178" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="70" y="180" width="220" height="60" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="205" text-anchor="middle">gh actions-lock --verify</text>
  <text x="180" y="225" text-anchor="middle" class="sub">兩邊對不上就失敗</text>
  <text x="180" y="275" text-anchor="middle" class="sub">像購物清單旁附上商品條碼</text>
</svg>
