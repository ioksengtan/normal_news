<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300">
  <rect width="360" height="300" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 13px; }
    .sub { fill: #5e584e; font-size: 11px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <rect x="110" y="15" width="140" height="50" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="38" text-anchor="middle">你的程式</text>
  <text x="180" y="55" text-anchor="middle" class="sub">AWS CLI 或 SDK</text>
  <line x1="150" y1="65" x2="95" y2="128" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <line x1="210" y1="65" x2="265" y2="128" stroke="#5e584e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="245" y1="88" x2="275" y2="108" stroke="#1c1915" stroke-width="1.5"/>
  <line x1="275" y1="88" x2="245" y2="108" stroke="#1c1915" stroke-width="1.5"/>
  <rect x="15" y="130" width="160" height="150" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="95" y="155" text-anchor="middle">自己的電腦</text>
  <rect x="35" y="170" width="120" height="50" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="95" y="193" text-anchor="middle">AWS Emulator</text>
  <text x="95" y="210" text-anchor="middle" class="sub">模擬的資源</text>
  <text x="95" y="250" text-anchor="middle" class="sub">不需要 AWS 帳號</text>
  <rect x="190" y="130" width="155" height="150" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="267" y="155" text-anchor="middle">AWS 雲端</text>
  <text x="267" y="205" text-anchor="middle" class="sub">測試時不送到這裡</text>
</svg>
