<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330">
  <rect width="360" height="330" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 15px; }
    .sub { fill: #5e584e; font-size: 12px; }
    .box { fill: #fffdf8; stroke: #1c1915; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <text x="180" y="28" text-anchor="middle">不模擬，直接轉成本機格式</text>
  <rect x="90" y="46" width="180" height="56" class="box"/>
  <text x="180" y="70" text-anchor="middle">PS5 可執行檔</text>
  <text x="180" y="90" text-anchor="middle" class="sub">使用者自備</text>
  <line x1="180" y1="104" x2="180" y2="136" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="60" y="140" width="240" height="64" class="box"/>
  <text x="180" y="166" text-anchor="middle">relinker（重新連結工具）</text>
  <text x="180" y="188" text-anchor="middle" class="sub">換成目標系統的原生格式</text>
  <line x1="110" y1="206" x2="110" y2="240" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <line x1="250" y1="206" x2="250" y2="240" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="30" y="244" width="160" height="50" class="box"/>
  <text x="110" y="276" text-anchor="middle">Linux</text>
  <rect x="200" y="244" width="130" height="50" class="box"/>
  <text x="265" y="276" text-anchor="middle">Windows</text>
  <text x="180" y="318" text-anchor="middle" class="sub">不用模擬器，也沒有另外的執行程序</text>
</svg>
