<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 398">
  <rect width="360" height="398" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 15px; }
    .sub { fill: #5e584e; font-size: 12px; }
    .box { fill: #fffdf8; stroke: #1c1915; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <text x="180" y="28" text-anchor="middle">ECC 的做法</text>
  <rect x="40" y="46" width="280" height="56" class="box"/>
  <text x="180" y="70" text-anchor="middle">先規劃</text>
  <text x="180" y="90" text-anchor="middle" class="sub">動手寫程式之前</text>
  <line x1="180" y1="104" x2="180" y2="130" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="40" y="134" width="280" height="56" class="box"/>
  <text x="180" y="158" text-anchor="middle">用測試驗證</text>
  <text x="180" y="178" text-anchor="middle" class="sub">確認修改沒有出錯</text>
  <line x1="180" y1="192" x2="180" y2="218" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="40" y="222" width="280" height="56" class="box"/>
  <text x="180" y="246" text-anchor="middle">換個視角審查</text>
  <text x="180" y="266" text-anchor="middle" class="sub">從新的上下文檢查自己的成果</text>
  <line x1="180" y1="280" x2="180" y2="306" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="40" y="310" width="280" height="56" class="box"/>
  <text x="180" y="334" text-anchor="middle">留下可重複使用的技能</text>
  <text x="180" y="354" text-anchor="middle" class="sub">記住重要的事</text>
</svg>
