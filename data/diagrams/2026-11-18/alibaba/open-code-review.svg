<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 400">
  <rect width="360" height="400" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 16px; }
    .sub { fill: #5e584e; font-size: 13px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <text x="180" y="28" text-anchor="middle">Open Code Review 的分工</text>
  <rect x="100" y="44" width="160" height="44" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="72" text-anchor="middle">Git 記下的改動</text>
  <line x1="180" y1="88" x2="180" y2="112" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="30" y="116" width="300" height="96" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="140" text-anchor="middle">固定的程式邏輯</text>
  <rect x="44" y="154" width="82" height="42" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="85" y="181" text-anchor="middle">選檔案</text>
  <rect x="139" y="154" width="82" height="42" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="181" text-anchor="middle">分組</text>
  <rect x="234" y="154" width="82" height="42" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="275" y="181" text-anchor="middle">套規則</text>
  <line x1="180" y1="212" x2="180" y2="238" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="60" y="242" width="240" height="60" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="268" text-anchor="middle">模型代理程式</text>
  <text x="180" y="290" text-anchor="middle" class="sub">臨場判斷、查找上下文</text>
  <line x1="180" y1="302" x2="180" y2="328" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="50" y="332" width="260" height="52" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="356" text-anchor="middle">審查意見</text>
  <text x="180" y="375" text-anchor="middle" class="sub">標明「第幾行」</text>
</svg>
