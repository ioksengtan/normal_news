<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330">
  <rect width="360" height="330" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 16px; }
    .sub { fill: #5e584e; font-size: 13px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <text x="180" y="28" text-anchor="middle">字寫出格子，蓋到隔壁</text>
  <text x="180" y="62" text-anchor="middle" class="sub">輸入：65 個字元的錯誤 Base64</text>
  <line x1="180" y1="72" x2="180" y2="98" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="20" y="104" width="130" height="60" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="85" y="132" text-anchor="middle">配置的陣列</text>
  <text x="85" y="152" text-anchor="middle" class="sub">50 位元組</text>
  <rect x="150" y="104" width="190" height="60" fill="#ebe4d4" stroke="#1c1915" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="245" y="132" text-anchor="middle">隔壁的資料</text>
  <text x="245" y="152" text-anchor="middle" class="sub">本來不該被改</text>
  <text x="180" y="219" text-anchor="middle">實際寫入 64 位元組：</text>
  <line x1="148" y1="252" x2="340" y2="252" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <line x1="150" y1="242" x2="150" y2="262" stroke="#1c1915" stroke-width="2"/>
  <text x="245" y="282" text-anchor="middle">超出結尾 62 位元組</text>
  <text x="180" y="314" text-anchor="middle" class="sub">Calif 表示：已示範從遠端讓伺服器執行程式</text>
</svg>
