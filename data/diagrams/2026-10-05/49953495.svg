<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300">
  <rect width="360" height="300" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 13px; }
    .sub { fill: #5e584e; font-size: 11px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <text x="180" y="28" text-anchor="middle">像廚房：常用的放流理台，其餘放儲藏室</text>
  <rect x="20" y="45" width="320" height="58" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="70" text-anchor="middle">顯示卡＝流理台</text>
  <text x="180" y="90" text-anchor="middle" class="sub">放最常用的幾千個專家</text>
  <rect x="20" y="120" width="320" height="58" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="145" text-anchor="middle">主記憶體＝儲藏室</text>
  <text x="180" y="165" text-anchor="middle" class="sub">放全部 24,576 個專家</text>
  <rect x="20" y="195" width="320" height="58" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="220" text-anchor="middle">固態硬碟</text>
  <text x="180" y="240" text-anchor="middle" class="sub">放一張大查詢表</text>
  <text x="180" y="282" text-anchor="middle" class="sub">每個字只需要其中 10 個專家</text>
</svg>
