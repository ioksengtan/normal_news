<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 250">
  <rect width="360" height="250" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 14px; }
    .sub { fill: #5e584e; font-size: 12px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <text x="180" y="30" text-anchor="middle">Cargo 的冷卻期（例：3 天）</text>
  <rect x="215" y="60" width="100" height="85" fill="#ebe4d4" stroke="#5e584e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="265" y="78" text-anchor="middle" class="sub">冷卻期內</text>
  <line x1="20" y1="120" x2="345" y2="120" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <text x="345" y="112" text-anchor="end" class="sub">今天</text>
  <circle cx="265" cy="120" r="9" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <line x1="257" y1="112" x2="273" y2="128" stroke="#1c1915" stroke-width="1.5"/>
  <line x1="273" y1="112" x2="257" y2="128" stroke="#1c1915" stroke-width="1.5"/>
  <text x="265" y="165" text-anchor="middle">新版本</text>
  <text x="265" y="183" text-anchor="middle" class="sub">先跳過</text>
  <circle cx="110" cy="120" r="9" fill="#1c1915"/>
  <text x="110" y="165" text-anchor="middle">較早的版本</text>
  <text x="110" y="183" text-anchor="middle" class="sub">Cargo 採用</text>
  <text x="180" y="225" text-anchor="middle" class="sub">像新貨上架先等幾天，確認沒被回收再買</text>
</svg>
