  </defs>
  <text x="180" y="28" text-anchor="middle" font-size="15">ECC 固定流程</text>
  <rect x="12" y="48" width="70" height="50" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="47" y="78" text-anchor="middle">計畫</text>
  <line x1="82" y1="73" x2="98" y2="73" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="100" y="48" width="70" height="50" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="135" y="78" text-anchor="middle">測試</text>
  <line x1="170" y1="73" x2="186" y2="73" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="188" y="48" width="70" height="50" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="223" y="78" text-anchor="middle">實作</text>
  <line x1="258" y1="73" x2="274" y2="73" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="276" y="48" width="72" height="50" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="312" y="78" text-anchor="middle">審查</text>
  <rect x="56" y="130" width="100" height="50" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
