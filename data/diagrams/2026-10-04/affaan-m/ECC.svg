  <line x1="156" y1="155" x2="178" y2="155" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="180" y="130" width="120" height="50" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="240" y="160" text-anchor="middle">記住重點</text>
