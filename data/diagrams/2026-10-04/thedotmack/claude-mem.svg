<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280">
  <rect width="360" height="280" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 13px; }
    .sub { fill: #5e584e; font-size: 11px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <rect x="20" y="40" width="110" height="70" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="75" y="70" text-anchor="middle">工作階段甲</text>
  <text x="75" y="92" text-anchor="middle" class="sub">觀察與操作</text>
  <line x1="130" y1="75" x2="158" y2="75" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="160" y="40" width="110" height="70" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="215" y="70" text-anchor="middle">壓縮摘要</text>
  <text x="215" y="92" text-anchor="middle" class="sub">寫入記憶</text>
  <line x1="270" y1="75" x2="298" y2="75" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="250" y="130" width="90" height="70" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <text x="295" y="160" text-anchor="middle">工作階段乙</text>
  <text x="295" y="182" text-anchor="middle" class="sub">注回脈絡</text>
  <path d="M215 110 L215 165 L250 165" fill="none" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="20" y="210" width="320" height="50" fill="#fbf8f1" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="240" text-anchor="middle">像把會議紀錄帶到下次開會</text>
