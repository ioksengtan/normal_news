<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 330">
  <rect width="360" height="330" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro 330ei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 16px; }
    .sub { fill: #5e584e; font-size: 13px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" marker330eight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <text x="180" y="26" text-anchor="middle">PMTiles：只拿需要的那一段</text>
  <rect x="20" y="62" width="320" height="70" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="52" text-anchor="middle" class="sub">放在 CDN 上的一個檔案（世界地圖 139 GB）</text>
  <rect x="30" y="78" width="40" height="38" fill="none" stroke="#5e584e"/>
  <rect x="76" y="78" width="40" height="38" fill="none" stroke="#5e584e"/>
  <rect x="122" y="78" width="40" height="38" fill="none" stroke="#5e584e"/>
  <rect x="168" y="78" width="40" height="38" fill="#ebe4d4" stroke="#1c1915" stroke-width="2.5"/>
  <rect x="214" y="78" width="40" height="38" fill="none" stroke="#5e584e"/>
  <rect x="260" y="78" width="40" height="38" fill="none" stroke="#5e584e"/>
  <text x="318" y="104" text-anchor="middle" class="sub">…</text>
  <line x1="188" y1="200" x2="188" y2="122" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <text x="200" y="150" class="sub">範圍請求</text>
  <text x="200" y="168" class="sub">「給我這一段」</text>
  <rect x="80" y="204" width="200" height="64" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <text x="180" y="232" text-anchor="middle">瀏覽器上的地圖</text>
  <text x="180" y="254" text-anchor="middle" class="sub">看一個城市約 5 MB</text>
  <text x="180" y="306" text-anchor="middle" class="sub">像只翻字典裡要查的那一頁</text>
</svg>
