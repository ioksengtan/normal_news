  <line x1="58" y1="236" x2="58" y2="276" stroke="#5e584e"/><line x1="80" y1="236" x2="80" y2="276" stroke="#5e584e"/><line x1="102" y1="236" x2="102" y2="276" stroke="#5e584e"/>
