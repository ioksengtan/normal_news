  <text x="180.0" y="81" text-anchor="middle" class="sub">例如 GIMP</text>
  <line x1="180" y1="89" x2="180" y2="111" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="30" y="115" width="140" height="36" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="100" y="139" text-anchor="middle">1 分析</text>
  <rect x="190" y="115" width="140" height="36" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="260" y="139" text-anchor="middle">2 設計</text>
  <rect x="30" y="161" width="140" height="36" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="100" y="185" text-anchor="middle">3 實作</text>
  <rect x="190" y="161" width="140" height="36" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="260" y="185" text-anchor="middle">4 規劃測試</text>
  <rect x="30" y="207" width="140" height="36" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
