  <rect x="190" y="207" width="140" height="36" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="260" y="231" text-anchor="middle">6 記錄結果</text>
  <rect x="30" y="253" width="140" height="36" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
