  <line x1="180" y1="295" x2="180" y2="317" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="60" y="321" width="240" height="44" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
  <text x="180.0" y="340" text-anchor="middle">命令列工具</text>
