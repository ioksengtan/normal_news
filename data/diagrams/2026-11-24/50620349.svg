<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380">
  <rect width="360" height="380" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 16px; }
    .sub { fill: #5e584e; font-size: 13px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <text x="180" y="30" text-anchor="middle">不必換郵件程式</text>
  <rect x="15" y="50" width="100" height="56" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="65" y="74" text-anchor="middle">Outlook</text>
  <text x="65" y="94" text-anchor="middle" class="sub">傳統版</text>
  <rect x="130" y="50" width="100" height="56" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="74" text-anchor="middle">Apple</text>
  <text x="180" y="94" text-anchor="middle" class="sub">Mail</text>
  <rect x="245" y="50" width="100" height="56" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="295" y="74" text-anchor="middle">手機</text>
  <text x="295" y="94" text-anchor="middle" class="sub">郵件程式</text>
  <line x1="65" y1="106" x2="65" y2="146" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <line x1="180" y1="106" x2="180" y2="146" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <line x1="295" y1="106" x2="295" y2="146" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="15" y="150" width="330" height="60" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="174" text-anchor="middle">Exchange 的通訊協定</text>
  <text x="180" y="196" text-anchor="middle" class="sub">MAPI over HTTP・EWS・ActiveSync</text>
  <line x1="180" y1="210" x2="180" y2="246" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="40" y="250" width="280" height="76" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="276" text-anchor="middle">Stalwart 1.2.0</text>
  <text x="180" y="298" text-anchor="middle" class="sub">郵件、行事曆、聯絡人</text>
  <text x="180" y="316" text-anchor="middle" class="sub">放在同一個帳號</text>
  <text x="180" y="356" text-anchor="middle" class="sub">新版 Outlook 不在支援之列</text>
</svg>
