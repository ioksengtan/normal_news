<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 480">
  <rect width="360" height="480" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 16px; }
    .sub { fill: #5e584e; font-size: 13px; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <text x="180" y="30" text-anchor="middle">claude-bughunter 的工作順序</text>
  <rect x="60" y="50" width="240" height="44" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
  <text x="180.0" y="69" text-anchor="middle">先確認授權</text>
  <text x="180.0" y="86" text-anchor="middle" class="sub">自己擁有或有書面授權</text>
  <line x1="180" y1="94" x2="180" y2="116" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="60" y="120" width="240" height="44" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="180.0" y="148.0" text-anchor="middle">偵察</text>
  <line x1="180" y1="164" x2="180" y2="186" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="60" y="190" width="240" height="44" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="180.0" y="218.0" text-anchor="middle">排序</text>
  <line x1="180" y1="234" x2="180" y2="256" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="60" y="260" width="240" height="44" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="180.0" y="288.0" text-anchor="middle">尋找漏洞</text>
  <line x1="180" y1="304" x2="180" y2="326" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="60" y="330" width="240" height="44" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
  <text x="180.0" y="349" text-anchor="middle">驗證</text>
  <text x="180.0" y="366" text-anchor="middle" class="sub">送出前 7 道問題檢查</text>
  <line x1="180" y1="374" x2="180" y2="396" stroke="#1c1915" stroke-width="2" marker-end="url(#箭頭)"/>
  <rect x="60" y="400" width="240" height="44" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="180.0" y="428.0" text-anchor="middle">撰寫報告</text>
</svg>
