  </style>

  <text x="180" y="30" text-anchor="middle">今日一笑</text>
  <rect x="150" y="60" width="190" height="150" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <rect x="150" y="60" width="190" height="24" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
  <text x="245" y="78" text-anchor="middle" class="sub">Ladybird Alpha</text>
  <circle cx="245" cy="130" r="22" fill="none" stroke="#1c1915" stroke-width="2"/>
  <text x="245" y="137" text-anchor="middle">?</text>
  <rect x="190" y="168" width="110" height="30" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
