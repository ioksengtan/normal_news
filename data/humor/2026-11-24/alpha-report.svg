  <circle cx="75" cy="150" r="22" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <circle cx="68" cy="146" r="2" fill="#1c1915"/>
  <circle cx="82" cy="146" r="2" fill="#1c1915"/>
