  <rect x="20" y="262" width="320" height="50" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="285" text-anchor="middle">「打不開？按一下就回報。」</text>
  <text x="180" y="303" text-anchor="middle" class="sub">Alpha 版本來就會遇到</text>
