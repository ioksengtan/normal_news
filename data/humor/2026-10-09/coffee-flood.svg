<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300">
  <rect width="360" height="300" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 15px; }
    .sub { fill: #5e584e; font-size: 12px; }
    .box { fill: #fffdf8; stroke: #1c1915; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="箭頭" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#1c1915"/>
    </marker>
  </defs>
  <rect x="30" y="40" width="110" height="90" class="box"/>
  <text x="85" y="78" text-anchor="middle">咖啡機</text>
  <text x="85" y="100" text-anchor="middle" class="sub">十天 · 約 1 TB</text>
  <line x1="145" y1="85" x2="195" y2="85" stroke="#1c1915" stroke-width="1.5" marker-end="url(#箭頭)"/>
  <rect x="200" y="40" width="130" height="90" class="box"/>
  <text x="265" y="78" text-anchor="middle">家中基地台</text>
  <text x="265" y="100" text-anchor="middle" class="sub">塞滿了…</text>
  <circle cx="90" cy="190" r="18" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <circle cx="84" cy="186" r="2.5" fill="#1c1915"/>
  <circle cx="96" cy="186" r="2.5" fill="#1c1915"/>
  <rect x="70" y="210" width="40" height="50" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <ellipse cx="220" cy="200" rx="100" ry="28" class="box"/>
  <text x="220" y="206" text-anchor="middle">先拔掉，換一台</text>
  <text x="180" y="286" text-anchor="middle" class="sub">多數流量留在家中網路，仍塞滿基地台</text>
</svg>
