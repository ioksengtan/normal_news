  <rect x="172" y="88" width="16" height="10" fill="#fffdf8" stroke="#1c1915" stroke-width="1.2"/>
  <circle cx="70" cy="80" r="18" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
  <rect x="52" y="100" width="36" height="52" fill="#fffdf8" stroke="#1c1915" stroke-width="1.5"/>
