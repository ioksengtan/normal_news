  </defs>
  <circle cx="80" cy="110" r="20" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <circle cx="74" cy="106" r="2.5" fill="#1c1915"/>
  <circle cx="86" cy="106" r="2.5" fill="#1c1915"/>
  <rect x="58" y="132" width="44" height="80" fill="#ebe4d4" stroke="#1c1915" stroke-width="1.5"/>
  <line x1="102" y1="150" x2="120" y2="96" stroke="#1c1915" stroke-width="2"/>
