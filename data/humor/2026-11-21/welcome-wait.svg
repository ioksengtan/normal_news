<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300">
  <rect width="360" height="300" fill="#f4f0e6"/>
  <style>
    text { font-family: "Noto Serif TC", "Songti TC", "PMingLiU", "WenQuanYi Micro Hei", "Droid Sans Fallback", serif; fill: #1c1915; font-size: 15px; }
    .sub { fill: #5e584e; font-size: 13px; }
  </style>
  <rect x="20" y="70" width="150" height="110" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <rect x="80" y="180" width="30" height="20" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
  <text x="95" y="100" text-anchor="middle" class="sub">先問信箱……</text>
  <text x="95" y="126" text-anchor="middle" class="sub">再問編號……</text>
  <text x="95" y="152" text-anchor="middle" class="sub">再記錯誤……</text>
  <circle cx="265" cy="120" r="24" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <circle cx="257" cy="116" r="2.5" fill="#1c1915"/>
  <circle cx="273" cy="116" r="2.5" fill="#1c1915"/>
  <line x1="257" y1="131" x2="273" y2="131" stroke="#1c1915" stroke-width="2"/>
  <rect x="240" y="146" width="50" height="64" fill="#ebe4d4" stroke="#1c1915" stroke-width="2"/>
  <rect x="200" y="20" width="140" height="56" rx="10" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <text x="270" y="44" text-anchor="middle">歡迎畫面呢？</text>
