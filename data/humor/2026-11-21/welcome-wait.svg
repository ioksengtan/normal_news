  <circle cx="320" cy="140" r="14" fill="#fffdf8" stroke="#1c1915" stroke-width="2"/>
  <line x1="320" y1="140" x2="320" y2="130" stroke="#1c1915" stroke-width="2"/>
  <line x1="320" y1="140" x2="327" y2="144" stroke="#1c1915" stroke-width="2"/>
  <text x="180" y="248" text-anchor="middle">一行程式，背後好幾次呼叫伺服器</text>
  <text x="180" y="274" text-anchor="middle" class="sub">安裝後的紀錄程式排在歡迎畫面前面</text>
